<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { min-height: 100%; }
  body {
    background: #0f0f11;
    color: #e8e4dc;
    font-family: 'Syne', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 4px; }
  ::selection { background: #c8a96e33; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TIMER_DURATION = 25 * 60;

const DEFAULT_BLOCKS = [
  { id: 1, label: "Morning anchor", start: "05:00", end: "08:30", color: "#c8a96e" },
  { id: 2, label: "Deep work", start: "09:00", end: "12:00", color: "#7eb8a4" },
  { id: 3, label: "Admin / email", start: "12:00", end: "13:30", color: "#8b9bb4" },
  { id: 4, label: "Learning", start: "14:00", end: "16:00", color: "#a07ec8" },
  { id: 5, label: "Shutdown ritual", start: "18:00", end: "18:30", color: "#c87e7e" },
];

function ls(key, fallback) {
  try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lss(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

function App() {
  const now = new Date();
  const today = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;

  const [tab, setTab] = useState("today");
  const [priorities, setPriorities] = useState(() => {
    const last = ls("cc_last_date", null);
    if (last === today) return ls("cc_priorities", [{id:1,text:"",done:false},{id:2,text:"",done:false},{id:3,text:"",done:false}]);
    return [{id:1,text:"",done:false},{id:2,text:"",done:false},{id:3,text:"",done:false}];
  });
  const [dump, setDump] = useState(() => ls("cc_dump", []));
  const [dumpInput, setDumpInput] = useState("");
  const [goals, setGoals] = useState(() => ls("cc_goals", ["","","","",""]));
  const [weekNotes, setWeekNotes] = useState(() => ls("cc_weeknotes", {win:"",obstacle:"",next:""}));
  const [blocks, setBlocks] = useState(() => ls("cc_blocks", DEFAULT_BLOCKS));
  const [editBlock, setEditBlock] = useState(null);
  const [timerSec, setTimerSec] = useState(TIMER_DURATION);
  const [timerOn, setTimerOn] = useState(false);
  const [timerMode, setTimerMode] = useState("focus");
  const [sessions, setSessions] = useState(() => ls("cc_sessions_today", 0));
  const timerRef = useRef(null);

  useEffect(() => { lss("cc_priorities", priorities); lss("cc_last_date", today); }, [priorities]);
  useEffect(() => { lss("cc_dump", dump); }, [dump]);
  useEffect(() => { lss("cc_goals", goals); }, [goals]);
  useEffect(() => { lss("cc_weeknotes", weekNotes); }, [weekNotes]);
  useEffect(() => { lss("cc_blocks", blocks); }, [blocks]);
  useEffect(() => { lss("cc_sessions_today", sessions); }, [sessions]);

  useEffect(() => {
    if (timerOn) {
      timerRef.current = setInterval(() => {
        setTimerSec(s => {
          if (s <= 1) {
            clearInterval(timerRef.current);
            setTimerOn(false);
            if (timerMode === "focus") {
              setSessions(n => n + 1);
              setTimerMode("break");
              return 5 * 60;
            } else {
              setTimerMode("focus");
              return TIMER_DURATION;
            }
          }
          return s - 1;
        });
      }, 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [timerOn, timerMode]);

  const doneCount = priorities.filter(p => p.done && p.text.trim()).length;
  const totalCount = priorities.filter(p => p.text.trim()).length;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const getHour = t => { const [h,m] = t.split(":").map(Number); return h + m/60; };

  const DAY_START = 5, DAY_END = 22, SPAN = 17;
  const nowH = now.getHours() + now.getMinutes()/60;
  const nowPct = Math.max(0, Math.min(1, (nowH - DAY_START) / SPAN));
  const circ = 2 * Math.PI * 54;
  const dash = circ * (1 - timerSec / (timerMode === "focus" ? TIMER_DURATION : 5*60));
  const hours = [5,7,9,11,13,15,17,19,21];

  const resetTimer = () => {
    setTimerOn(false);
    setTimerSec(timerMode === "focus" ? TIMER_DURATION : 5*60);
  };

  const switchMode = (mode) => {
    setTimerMode(mode);
    setTimerOn(false);
    setTimerSec(mode === "focus" ? TIMER_DURATION : 5*60);
  };

  return (
    <div style={{minHeight:"100vh", display:"flex", flexDirection:"column"}}>

      {/* Header */}
      <header style={{borderBottom:"1px solid #2a2a30", padding:"20px 24px 16px", display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexShrink:0}}>
        <div>
          <div style={{fontFamily:"'DM Mono',monospace", fontSize:"10px", letterSpacing:"0.15em", color:"#c8a96e", textTransform:"uppercase", marginBottom:"4px"}}>
            {DAYS[now.getDay()]}
          </div>
          <h1 style={{fontSize:"22px", fontWeight:700, color:"#f0ece4", lineHeight:1}}>
            {MONTHS[now.getMonth()]} {now.getDate()}
          </h1>
        </div>
        <div style={{fontFamily:"'DM Mono',monospace", fontSize:"11px", color: doneCount === totalCount && totalCount > 0 ? "#7eb8a4" : "#5a5a62"}}>
          {totalCount > 0 ? `${doneCount}/${totalCount} done` : "nothing set"}
        </div>
      </header>

      {/* Tabs */}
      <nav style={{display:"flex", borderBottom:"1px solid #2a2a30", flexShrink:0, overflowX:"auto"}}>
        {[["today","Today"],["goals","Goals"],["schedule","Schedule"],["timer","Timer"]].map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            fontFamily:"'DM Mono',monospace", fontSize:"10px", letterSpacing:"0.12em", textTransform:"uppercase",
            padding:"13px 18px 11px", border:"none", background:"transparent", whiteSpace:"nowrap",
            color: tab===k ? "#c8a96e" : "#5a5a62",
            borderBottom: tab===k ? "2px solid #c8a96e" : "2px solid transparent",
            marginBottom:"-1px"
          }}>{l}</button>
        ))}
      </nav>

      {/* Body */}
      <div style={{flex:1, overflowY:"auto", padding:"28px 24px", maxWidth:"680px", margin:"0 auto", width:"100%"}}>

        {/* TODAY */}
        {tab === "today" && <>
          <div style={{marginBottom:"36px"}}>
            <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", color:"#5a5a62", textTransform:"uppercase", marginBottom:"14px"}}>The Big 3</div>
            {priorities.map((p,i) => (
              <div key={p.id} style={{display:"flex", alignItems:"center", gap:"12px", padding:"13px 14px", background:"#17171c", borderRadius:"8px", marginBottom:"8px", border:"1px solid #2a2a30", opacity: p.done ? 0.45 : 1, transition:"opacity 0.2s"}}>
                <span style={{fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"#c8a96e", flexShrink:0}}>{i+1}</span>
                <div onClick={() => setPriorities(prev => prev.map(x => x.id===p.id ? {...x,done:!x.done} : x))}
                  style={{width:"17px", height:"17px", borderRadius:"50%", border: p.done ? "2px solid #7eb8a4" : "2px solid #3a3a42", background: p.done ? "#7eb8a4" : "transparent", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.15s"}}>
                  {p.done && <span style={{color:"#0f0f11", fontSize:"9px", fontWeight:700}}>✓</span>}
                </div>
                <input value={p.text} onChange={e => setPriorities(prev => prev.map(x => x.id===p.id ? {...x,text:e.target.value} : x))}
                  placeholder={`Priority ${i+1}…`}
                  style={{background:"transparent", border:"none", color:"#e8e4dc", fontFamily:"'Lora',serif", fontSize:"15px", flex:1, caretColor:"#c8a96e", textDecoration: p.done ? "line-through" : "none"}} />
              </div>
            ))}
          </div>

          <div>
            <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", color:"#5a5a62", textTransform:"uppercase", marginBottom:"14px"}}>Brain dump</div>
            <div style={{display:"flex", gap:"8px", marginBottom:"14px"}}>
              <input value={dumpInput} onChange={e => setDumpInput(e.target.value)}
                onKeyDown={e => { if(e.key==="Enter" && dumpInput.trim()) { setDump(prev => [{id:Date.now(),text:dumpInput.trim(),done:false},...prev]); setDumpInput(""); }}}
                placeholder="Thought, task, reminder…"
                style={{flex:1, background:"#17171c", border:"1px solid #2a2a30", borderRadius:"8px", color:"#e8e4dc", fontFamily:"'Lora',serif", fontSize:"14px", padding:"10px 12px", caretColor:"#c8a96e"}} />
              <button onClick={() => { if(dumpInput.trim()) { setDump(prev => [{id:Date.now(),text:dumpInput.trim(),done:false},...prev]); setDumpInput(""); }}}
                style={{background:"#c8a96e", border:"none", borderRadius:"8px", color:"#0f0f11", fontFamily:"'DM Mono',monospace", fontSize:"11px", fontWeight:500, padding:"10px 16px", letterSpacing:"0.05em"}}>
                Add
              </button>
            </div>
            {dump.length === 0 && <div style={{fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"#2a2a30", padding:"8px 0"}}>Empty — capture anything here</div>}
            {dump.map(d => (
              <div key={d.id} style={{display:"flex", alignItems:"flex-start", gap:"10px", padding:"10px 0", borderBottom:"1px solid #1e1e24", opacity: d.done ? 0.4 : 1}}>
                <div onClick={() => setDump(prev => prev.map(x => x.id===d.id ? {...x,done:!x.done} : x))}
                  style={{width:"16px", height:"16px", borderRadius:"50%", border: d.done ? "2px solid #7eb8a4" : "2px solid #3a3a42", background: d.done ? "#7eb8a4" : "transparent", cursor:"pointer", flexShrink:0, marginTop:"2px", display:"flex", alignItems:"center", justifyContent:"center"}}>
                  {d.done && <span style={{color:"#0f0f11", fontSize:"8px", fontWeight:700}}>✓</span>}
                </div>
                <span style={{flex:1, fontFamily:"'Lora',serif", fontSize:"14px", color:"#e8e4dc", textDecoration: d.done ? "line-through" : "none", lineHeight:1.5}}>{d.text}</span>
                <button onClick={() => setDump(prev => prev.filter(x => x.id!==d.id))}
                  style={{background:"none", border:"none", color:"#3a3a42", fontSize:"16px", padding:"0 2px", lineHeight:1, flexShrink:0}}>×</button>
              </div>
            ))}
          </div>
        </>}

        {/* GOALS */}
        {tab === "goals" && <>
          <div style={{marginBottom:"36px"}}>
            <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", color:"#5a5a62", textTransform:"uppercase", marginBottom:"14px"}}>This week's objectives</div>
            {goals.map((g,i) => (
              <div key={i} style={{display:"flex", alignItems:"center", gap:"12px", marginBottom:"12px"}}>
                <span style={{fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"#a07ec8", width:"22px", flexShrink:0}}>W{i+1}</span>
                <input value={g} onChange={e => setGoals(prev => { const n=[...prev]; n[i]=e.target.value; return n; })}
                  placeholder={`Goal ${i+1}…`}
                  style={{flex:1, background:"transparent", border:"none", borderBottom:"1px solid #2a2a30", color:"#e8e4dc", fontFamily:"'Lora',serif", fontSize:"14px", padding:"6px 0", caretColor:"#c8a96e"}} />
              </div>
            ))}
          </div>
          <div style={{padding:"20px", background:"#17171c", borderRadius:"8px", border:"1px solid #2a2a30"}}>
            <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", letterSpacing:"0.18em", color:"#5a5a62", textTransform:"uppercase", marginBottom:"16px"}}>Weekly check-in</div>
            {[["win","Win this week","#7eb8a4"],["obstacle","Main obstacle","#c87e7e"],["next","Focus next week","#c8a96e"]].map(([key,label,color]) => (
              <div key={key} style={{marginBottom:"16px"}}>
                <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", color, letterSpacing:"0.1em", marginBottom:"8px"}}>{label}</div>
                <textarea value={weekNotes[key]} onChange={e => setWeekNotes(prev => ({...prev,[key]:e.target.value}))}
                  placeholder="…"
                  style={{background:"#0f0f11", border:"1px solid #2a2a30", borderRadius:"6px", color:"#e8e4dc", fontFamily:"'Lora',serif", fontSize:"13px", padding:"8px 10px", width:"100%", minHeight:"60px", resize:"vertical", caretColor:"#c8a96e"}} />
              </div>
            ))}
          </div>
        </>}

        {/* SCHEDULE */}
        {tab === "schedule" && <>
          <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", color:"#5a5a62", textTransform:"uppercase", marginBottom:"20px"}}>Daily time blocks</div>
          <div style={{display:"flex", gap:"14px"}}>
            <div style={{width:"40px", flexShrink:0, position:"relative", minHeight:"460px"}}>
              {hours.map(h => {
                const pct = (h - DAY_START) / SPAN;
                return <div key={h} style={{position:"absolute", top:`${pct*100}%`, fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"#3a3a42", transform:"translateY(-50%)", width:"38px", textAlign:"right"}}>
                  {h < 12 ? `${h}am` : h===12 ? "12pm" : `${h-12}pm`}
                </div>;
              })}
            </div>
            <div style={{flex:1, position:"relative", minHeight:"460px", borderLeft:"1px solid #2a2a30"}}>
              {hours.map(h => <div key={h} style={{position:"absolute", top:`${((h-DAY_START)/SPAN)*100}%`, left:0, right:0, borderTop:"1px solid #1e1e24"}} />)}
              {nowH >= DAY_START && nowH <= DAY_END && (
                <div style={{position:"absolute", top:`${nowPct*100}%`, left:0, right:0, height:"1px", background:"#c8a96e", zIndex:5, display:"flex", alignItems:"center"}}>
                  <div style={{width:"6px", height:"6px", borderRadius:"50%", background:"#c8a96e", marginLeft:"-3px", flexShrink:0}} />
                </div>
              )}
              {blocks.map(b => {
                const s1 = getHour(b.start), e1 = getHour(b.end);
                const top = ((s1 - DAY_START) / SPAN) * 100;
                const height = ((e1 - s1) / SPAN) * 100;
                return (
                  <div key={b.id} onClick={() => setEditBlock(editBlock===b.id ? null : b.id)}
                    style={{position:"absolute", top:`${top}%`, left:"10px", right:0, height:`${height}%`, background:`${b.color}20`, borderLeft:`3px solid ${b.color}`, borderRadius:"0 6px 6px 0", padding:"5px 8px", cursor:"pointer", overflow:"hidden", boxSizing:"border-box"}}>
                    <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", color:b.color, letterSpacing:"0.06em"}}>{b.start}–{b.end}</div>
                    {editBlock === b.id
                      ? <input autoFocus value={b.label} onClick={e => e.stopPropagation()}
                          onChange={e => setBlocks(prev => prev.map(x => x.id===b.id ? {...x,label:e.target.value} : x))}
                          style={{background:"transparent", border:"none", borderBottom:`1px solid ${b.color}`, color:"#e8e4dc", fontFamily:"'Syne',sans-serif", fontSize:"12px", width:"100%", caretColor:b.color}} />
                      : <div style={{fontFamily:"'Syne',sans-serif", fontSize:"12px", fontWeight:500, color:"#e8e4dc", marginTop:"1px"}}>{b.label}</div>
                    }
                  </div>
                );
              })}
            </div>
          </div>
          <div style={{fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"#3a3a42", marginTop:"12px"}}>Tap any block to rename it.</div>
        </>}

        {/* TIMER */}
        {tab === "timer" && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", paddingTop:"16px"}}>
            <div style={{fontFamily:"'DM Mono',monospace", fontSize:"10px", letterSpacing:"0.18em", textTransform:"uppercase", color: timerMode==="focus" ? "#c8a96e" : "#7eb8a4", marginBottom:"20px"}}>
              {timerMode === "focus" ? "Focus session" : "Short break"}
            </div>
            <div style={{position:"relative", width:"128px", height:"128px", marginBottom:"24px"}}>
              <svg width="128" height="128" style={{transform:"rotate(-90deg)"}}>
                <circle cx="64" cy="64" r="54" fill="none" stroke="#1e1e24" strokeWidth="3" />
                <circle cx="64" cy="64" r="54" fill="none" stroke={timerMode==="focus" ? "#c8a96e" : "#7eb8a4"} strokeWidth="3"
                  strokeDasharray={circ} strokeDashoffset={dash} strokeLinecap="round"
                  style={{transition:"stroke-dashoffset 0.8s linear"}} />
              </svg>
              <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'DM Mono',monospace", fontSize:"36px", fontWeight:300, color:"#f0ece4", letterSpacing:"0.05em"}}>
                {fmt(timerSec)}
              </div>
            </div>
            <div style={{display:"flex", gap:"10px", marginBottom:"24px"}}>
              <button onClick={() => setTimerOn(r => !r)}
                style={{background: timerMode==="focus" ? "#c8a96e" : "#7eb8a4", border:"none", borderRadius:"6px", color:"#0f0f11", fontFamily:"'DM Mono',monospace", fontSize:"11px", fontWeight:500, padding:"10px 28px", letterSpacing:"0.1em", textTransform:"uppercase"}}>
                {timerOn ? "Pause" : "Start"}
              </button>
              <button onClick={resetTimer}
                style={{background:"transparent", border:"1px solid #2a2a30", borderRadius:"6px", color:"#8b8b96", fontFamily:"'DM Mono',monospace", fontSize:"11px", padding:"10px 18px", letterSpacing:"0.1em", textTransform:"uppercase"}}>
                Reset
              </button>
            </div>
            <div style={{fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"#5a5a62", marginBottom:"32px"}}>
              {sessions} session{sessions!==1?"s":""} completed today
            </div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", width:"100%", maxWidth:"280px"}}>
              {[["focus","25 min focus","#c8a96e"],["break","5 min break","#7eb8a4"]].map(([mode,label,color]) => (
                <div key={mode} onClick={() => switchMode(mode)}
                  style={{padding:"13px 14px", background: timerMode===mode ? `${color}18` : "#17171c", border:`1px solid ${timerMode===mode ? color+"55" : "#2a2a30"}`, borderRadius:"8px", cursor:"pointer", textAlign:"center"}}>
                  <div style={{fontFamily:"'DM Mono',monospace", fontSize:"10px", color: timerMode===mode ? color : "#5a5a62", letterSpacing:"0.08em"}}>{label}</div>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
