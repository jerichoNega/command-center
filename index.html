<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Command Center" />
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { min-height: 100%; height: 100%; }
  body {
    background: #020617;
    color: #f1f5f9;
    font-family: 'Syne', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow-x: hidden;
  }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }
  button { cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  button:active { transform: scale(0.96); }
  
  .glass {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }
  
  .card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 16px;
    transition: all 0.3s ease;
  }
  .card:focus-within {
    border-color: #38bdf8;
    background: #1e293b;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  ::selection { background: #0ea5e933; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const SUPABASE_URL  = "https://gvfmbhxojigrwvxiloil.supabase.co/";
const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2Zm1iaHhvamlncnd2eGlsb2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDk4MTEsImV4cCI6MjA5MDg4NTgxMX0.JgnlAXIAH_p2wfmeqvSRiZ6CcUPVzmov-JHKE9LtHAY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TIMER_DURATION = 25 * 60;

const DEFAULT_DATA = {
  priorities: [{id:1,text:"",done:false},{id:2,text:"",done:false},{id:3,text:"",done:false}],
  dump: [],
  goals: ["","","","",""],
  weekNotes: { win:"", obstacle:"", next:"" },
  blocks: [
    {id:1,label:"Morning anchor",start:"05:00",end:"08:30",color:"#c8a96e"},
    {id:2,label:"Deep work",start:"09:00",end:"12:00",color:"#7eb8a4"},
    {id:3,label:"Admin / email",start:"12:00",end:"13:30",color:"#8b9bb4"},
    {id:4,label:"Learning",start:"14:00",end:"16:00",color:"#a07ec8"},
    {id:5,label:"Shutdown ritual",start:"18:00",end:"18:30",color:"#c87e7e"},
  ],
};

function ls(k, fb) { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fb; } catch { return fb; } }
function lss(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function SetupScreen({ onDone }) {
  const [key, setKey] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const go = async () => {
    const trimmed = key.trim().toLowerCase().replace(/\s+/g, "-");
    if (trimmed.length < 3) { setErr("At least 3 characters please"); return; }
    setLoading(true); setErr("");
    try {
      const { data, error } = await sb.from("command_center").select("data").eq("sync_key", trimmed).maybeSingle();
      if (error) throw error;
      lss("cc_sync_key", trimmed);
      onDone(trimmed, data?.data || null);
    } catch (e) { setErr("Connection error."); }
    setLoading(false);
  };
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:"32px"}}>
      <h1 style={{fontSize:"24px",fontWeight:700,color:"#f0ece4",marginBottom:"32px"}}>Command Center</h1>
      <input value={key} onChange={e => setKey(e.target.value)} onKeyDown={e => e.key === "Enter" && go()} placeholder="Sync Key" className="card" style={{background:"#121217",padding:"14px 16px",width:"100%",maxWidth:"320px",color:"#fafafa",textAlign:"center",marginBottom:"16px"}} />
      <button onClick={go} style={{background:"#0ea5e9",border:"none",borderRadius:"8px",color:"#020617",fontWeight:700,padding:"12px 32px"}}>{loading?"Connecting...":"Enter"}</button>
    </div>
  );
}

function App() {
  const [syncKey, setSyncKey] = useState(() => ls("cc_sync_key", null));
  const [synced, setSynced] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle");
  const now = new Date();
  const today = now.toISOString().slice(0, 10);

  const [tab, setTab] = useState("today");
  const [priorities, setPriorities] = useState(DEFAULT_DATA.priorities);
  const [dump, setDump] = useState(DEFAULT_DATA.dump);
  const [dumpInput, setDumpInput] = useState("");
  const [goals, setGoals] = useState(DEFAULT_DATA.goals);
  const [weekNotes, setWeekNotes] = useState(DEFAULT_DATA.weekNotes);
  const [blocks, setBlocks] = useState(DEFAULT_DATA.blocks);
  const [editBlock, setEditBlock] = useState(null);
  const [timerSec, setTimerSec] = useState(TIMER_DURATION);
  const [timerOn, setTimerOn] = useState(false);
  const [timerMode, setTimerMode] = useState("focus");
  const [sessions, setSessions] = useState(0);
  const [focusMode, setFocusMode] = useState(false);
  const timerRef = useRef(null);
  const saveTimer = useRef(null);
  const initialized = useRef(false);

  useEffect(() => { if (timerOn && timerMode === "focus") setFocusMode(true); }, [timerOn, timerMode]);

  const loadRemoteData = (remoteData) => {
    if (!remoteData) return;
    const ld = remoteData.lastDate;
    if (ld === today && remoteData.priorities) setPriorities([...remoteData.priorities]);
    if (remoteData.dump) setDump([...remoteData.dump]);
    if (remoteData.goals) setGoals([...remoteData.goals]);
    if (remoteData.weekNotes) setWeekNotes({...remoteData.weekNotes});
    if (remoteData.blocks) setBlocks([...remoteData.blocks]);
  };

  const fetchData = async () => {
    if (!syncKey) return;
    try {
      const { data, error } = await sb.from("command_center").select("data").eq("sync_key", syncKey).order('updated_at', { ascending: false });
      if (!error && data?.length > 0 && syncStatus === "idle") loadRemoteData(data[0].data);
    } catch (e) {}
  };

  useEffect(() => {
    if (!syncKey) return;
    (async () => { await fetchData(); setSynced(true); initialized.current = true; })();
  }, [syncKey]);

  useEffect(() => {
    if (!synced || !syncKey) return;
    const interval = setInterval(() => { if (syncStatus === "idle") fetchData(); }, 10000);
    return () => clearInterval(interval);
  }, [synced, syncKey, syncStatus]);

  const saveToCloud = useCallback((payload) => {
    if (!initialized.current || !syncKey) return;
    clearTimeout(saveTimer.current);
    setSyncStatus("saving");
    saveTimer.current = setTimeout(async () => {
      try {
        await sb.from("command_center").upsert({ sync_key: syncKey, data: payload, updated_at: new Date().toISOString() });
        setSyncStatus("saved"); setTimeout(() => setSyncStatus("idle"), 2000);
      } catch { setSyncStatus("error"); }
    }, 1200);
  }, [syncKey]);

  useEffect(() => { if (initialized.current) saveToCloud({ priorities, dump, goals, weekNotes, blocks, lastDate: today }); }, [priorities, dump, goals, weekNotes, blocks]);

  useEffect(() => {
    if (timerOn) {
      timerRef.current = setInterval(() => {
        setTimerSec(s => {
          if (s <= 1) {
            clearInterval(timerRef.current); setTimerOn(false);
            if (timerMode === "focus") { setSessions(n => n + 1); setTimerMode("break"); return 5*60; }
            else { setTimerMode("focus"); return TIMER_DURATION; }
          }
          return s - 1;
        });
      }, 1000);
    } else { clearInterval(timerRef.current); }
    return () => clearInterval(timerRef.current);
  }, [timerOn, timerMode]);

  const addBlock = () => {
    const lastBlock = blocks[blocks.length - 1];
    const newStart = lastBlock ? lastBlock.end : "09:00";
    const [h, m] = newStart.split(":").map(Number);
    const newEnd = `${String(h + 1).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    setBlocks([...blocks, { id: Date.now(), label: "New Event", start: newStart, end: newEnd, color: "#38bdf8" }]);
  };

  const deleteBlock = (id) => setBlocks(blocks.filter(b => b.id !== id));

  if (!syncKey || !synced) return <SetupScreen onDone={(k, d) => { setSyncKey(k); loadRemoteData(d); setSynced(true); initialized.current = true; }} />;

  const doneCount = priorities.filter(p => p.done && p.text.trim()).length;
  const totalCount = priorities.filter(p => p.text.trim()).length;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const getHour = t => { const [h,m] = t.split(":").map(Number); return h + m/60; };
  const DAY_START = 5, DAY_END = 22, SPAN = 17;
  const nowH = now.getHours() + now.getMinutes()/60;
  const statusColor = { idle:"#64748b", saving:"#0ea5e9", saved:"#10b981", error:"#ef4444" }[syncStatus];
  const currentPriorityText = priorities.find(p => !p.done && p.text.trim())?.text || "Stay focused";

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      {focusMode && (
        <div className="animate-in" style={{position:"fixed",inset:0,zIndex:1000,background:"#020617",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px"}}>
          <button onClick={() => {setFocusMode(false); setTimerOn(false);}} style={{position:"absolute",top:"30px",right:"30px",background:"none",border:"none",color:"#64748b",fontFamily:"'DM Mono',monospace",fontSize:"12px"}}>EXIT FOCUS</button>
          <div style={{textAlign:"center",marginBottom:"60px"}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#0ea5e9",letterSpacing:"0.3em",marginBottom:"16px"}}>CURRENT FOCUS</div>
            <h2 style={{fontSize:"32px",fontWeight:700,color:"#f8fafc",maxWidth:"600px", lineHeight:1.3}}>{currentPriorityText}</h2>
          </div>
          <div style={{position:"relative",width:"240px",height:"240px",marginBottom:"40px",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="240" height="240" style={{position:"absolute",transform:"rotate(-90deg)"}}>
              <circle cx="120" cy="120" r="110" fill="none" stroke="#0f172a" strokeWidth="4" />
              <circle cx="120" cy="120" r="110" fill="none" stroke="#0ea5e9" strokeWidth="4" strokeDasharray={2*Math.PI*110} strokeDashoffset={(2*Math.PI*110)*(1-timerSec/TIMER_DURATION)} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s linear"}} />
            </svg>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"64px",color:"#f8fafc",fontWeight:300}}>{fmt(timerSec)}</div>
          </div>
          <button onClick={() => setTimerOn(!timerOn)} style={{background:"transparent",border:"2px solid #0ea5e9",color:"#0ea5e9",borderRadius:"40px",padding:"16px 48px",fontFamily:"'DM Mono',monospace", fontWeight:700, letterSpacing:"0.1em"}}>{timerOn?"PAUSE":"RESUME"}</button>
        </div>
      )}

      <header className="glass" style={{padding:"24px 32px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:10}}>
        <div>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#0ea5e9", letterSpacing:"0.2em"}}>{DAYS[now.getDay()].toUpperCase()}</div>
          <h1 style={{fontSize:"24px",fontWeight:800, color:"#f8fafc"}}>{MONTHS[now.getMonth()]} {now.getDate()}</h1>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#10b981", fontWeight:600}}>{doneCount}/{totalCount} DONE</div>
          <div style={{fontSize:"9px",color:statusColor, fontWeight:700, letterSpacing:"0.1em", marginTop:"4px"}}>{syncStatus.toUpperCase()}</div>
        </div>
      </header>

      <nav className="glass" style={{display:"flex",overflowX:"auto",position:"sticky",top:"80px",zIndex:9}}>
        {["today","goals","schedule","timer"].map(k => (
          <button key={k} onClick={() => setTab(k)} style={{flex:1,padding:"16px",border:"none",background:"transparent",color:tab===k?"#0ea5e9":"#64748b",borderBottom:tab===k?"2px solid #0ea5e9":"2px solid transparent",fontSize:"10px",fontWeight:700, letterSpacing:"0.1em"}}>{k.toUpperCase()}</button>
        ))}
      </nav>

      <div style={{flex:1,overflowY:"auto",padding:"32px 24px",maxWidth:"720px",margin:"0 auto",width:"100%"}}>
        {tab === "today" && <div className="animate-in">
          <div style={{marginBottom:"48px"}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#64748b",letterSpacing:"0.2em", marginBottom:"16px"}}>THE BIG 3</div>
            {priorities.map((p,i) => (
              <div key={p.id} className="card" style={{display:"flex",alignItems:"center",gap:"16px",padding:"16px 20px",marginBottom:"12px",opacity:p.done?0.5:1}}>
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#0ea5e9", fontWeight:700}}>{i+1}</span>
                <div onClick={() => setPriorities(prev => prev.map(x => x.id===p.id?{...x,done:!x.done}:x))} style={{width:"22px",height:"22px",borderRadius:"50%",border:p.done?"2px solid #10b981":"2px solid #334155",background:p.done?"#10b981":"transparent",display:"flex",alignItems:"center",justifyContent:"center", transition:"all 0.2s"}}>{p.done && <span style={{color:"#020617", fontSize:"10px", fontWeight:900}}>✓</span>}</div>
                <input value={p.text} onChange={e => setPriorities(prev => prev.map(x => x.id===p.id?{...x,text:e.target.value}:x))} placeholder={`Priority ${i+1}…`} style={{background:"transparent",border:"none",color:"#f1f5f9",fontFamily:"'Lora',serif",fontSize:"17px",flex:1,textDecoration:p.done?"line-through":"none", fontWeight:500}} />
              </div>
            ))}
          </div>
          <div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#64748b",letterSpacing:"0.2em", marginBottom:"16px"}}>BRAIN DUMP</div>
            <div style={{display:"flex",gap:"12px",marginBottom:"24px"}}>
              <input value={dumpInput} onChange={e => setDumpInput(e.target.value)} onKeyDown={e => {if(e.key==="Enter"&&dumpInput.trim()){setDump(p=>[{id:Date.now(),text:dumpInput.trim(),done:false},...p]);setDumpInput("");}}} placeholder="Capture a thought..." className="card" style={{flex:1,padding:"14px 16px",color:"#f1f5f9", fontSize:"15px", fontFamily:"'Lora',serif"}} />
              <button onClick={() => {if(dumpInput.trim()){setDump(p=>[{id:Date.now(),text:dumpInput.trim(),done:false},...p]);setDumpInput("");}}} style={{background:"#0ea5e9", color:"#020617", border:"none", borderRadius:"12px", padding:"0 24px", fontWeight:700, fontSize:"11px"}}>ADD</button>
            </div>
            {dump.map(d => (
              <div key={d.id} className="animate-in" style={{display:"flex",alignItems:"center",gap:"14px",padding:"16px 0",borderBottom:"1px solid #1e293b",opacity:d.done?0.5:1}}>
                <div onClick={() => setDump(prev => prev.map(x => x.id===d.id?{...x,done:!x.done}:x))} style={{width:"18px",height:"18px",borderRadius:"50%",border:d.done?"2px solid #10b981":"2px solid #334155", background: d.done ? "#10b981" : "transparent", display:"flex",alignItems:"center",justifyContent:"center"}}>{d.done && <span style={{color:"#020617", fontSize:"9px", fontWeight:900}}>✓</span>}</div>
                <span style={{flex:1,fontFamily:"'Lora',serif",fontSize:"15px",color:d.done?"#64748b":"#cbd5e1",textDecoration:d.done?"line-through":"none", lineHeight:1.6}}>{d.text}</span>
                <button onClick={() => setDump(p => p.filter(x => x.id!==d.id))} style={{background:"none",border:"none",color:"#334155", fontSize:"20px"}}>×</button>
              </div>
            ))}
          </div>
        </div>}

        {tab === "goals" && <div className="animate-in">
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#64748b",letterSpacing:"0.2em", marginBottom:"24px"}}>WEEKLY OBJECTIVES</div>
          {goals.map((g,i) => (
            <div key={i} className="card" style={{display:"flex", alignItems:"center", padding:"16px", marginBottom:"12px"}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:"11px",color:"#0ea5e9", width:"32px"}}>W{i+1}</span>
              <input value={g} onChange={e => setGoals(p => {const n=[...p]; n[i]=e.target.value; return n;})} placeholder={`Goal for week ${i+1}...`} style={{flex:1, background:"transparent", border:"none", color:"#f1f5f9", fontFamily:"'Lora',serif", fontSize:"16px"}} />
            </div>
          ))}
        </div>}

        {tab === "schedule" && <div className="animate-in">
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"24px"}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#64748b",letterSpacing:"0.2em"}}>TIMELINE</div>
            <button onClick={addBlock} style={{background:"#1e293b", border:"1px solid #334155", color:"#0ea5e9", borderRadius:"8px", padding:"6px 12px", fontSize:"10px", fontWeight:700}}>+ ADD BLOCK</button>
          </div>
          <div style={{display:"flex",gap:"24px", position:"relative"}}>
            <div style={{width:"48px",position:"relative",minHeight:"700px"}}>
              {hours.map(h => <div key={h} style={{position:"absolute",top:`${((h-DAY_START)/SPAN)*100}%`,fontSize:"10px",color:"#475569", fontFamily:"'DM Mono',monospace", width:"100%", textAlign:"right", transform:"translateY(-50%)"}}>{h < 12 ? `${h}am` : h === 12 ? "12pm" : `${h-12}pm`}</div>)}
            </div>
            <div style={{flex:1,position:"relative",borderLeft:"1px solid #1e293b", background:"linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.02) 50%, transparent)"}}>
              {nowH >= DAY_START && nowH <= DAY_END && (
                <div style={{position:"absolute", top:`${((nowH-DAY_START)/SPAN)*100}%`, left:0, right:0, height:"2px", background:"#0ea5e9", zIndex:5, boxShadow:"0 0 10px #0ea5e9"}}>
                  <div style={{position:"absolute", left:-6, top:-4, width:"10px", height:"10px", borderRadius:"50%", background:"#0ea5e9", boxShadow:"0 0 15px #0ea5e9"}} />
                </div>
              )}
              {blocks.map(b => {
                const s=getHour(b.start), e=getHour(b.end);
                const isLive = nowH >= s && nowH <= e;
                return (
                  <div key={b.id} className="card" onClick={() => setEditBlock(editBlock===b.id?null:b.id)} style={{
                    position:"absolute", top:`${((s-DAY_START)/SPAN)*100}%`, height:`${((e-s)/SPAN)*100}%`, left:12, right:0, 
                    background: isLive ? `linear-gradient(135deg, ${b.color}25, ${b.color}10)` : `${b.color}10`,
                    borderLeft:`4px solid ${b.color}`, borderRadius:"4px 12px 12px 4px", padding:"12px", 
                    cursor:"pointer", overflow:"hidden", boxShadow: isLive ? `0 0 20px ${b.color}20` : "none",
                    border: isLive ? `1px solid ${b.color}40` : "1px solid #1e293b", borderLeftWidth: "4px"
                  }}>
                    <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
                      <div style={{fontSize:"9px",color:b.color, fontFamily:"'DM Mono',monospace", fontWeight:800}}>{b.start} – {b.end}</div>
                      {isLive && <div style={{fontSize:"8px", background:b.color, color:"#020617", padding:"2px 6px", borderRadius:"10px", fontWeight:900, animation: "pulse 2s infinite"}}>LIVE</div>}
                    </div>
                    {editBlock===b.id ? (
                      <div style={{marginTop:"8px"}} onClick={e => e.stopPropagation()}>
                        <input autoFocus value={b.label} onChange={e => setBlocks(p => p.map(x => x.id===b.id?{...x,label:e.target.value}:x))} style={{background:"rgba(0,0,0,0.2)", border:"1px solid #334155", borderRadius:"4px", color:"#fff", width:"100%", padding:"4px 8px", fontSize:"13px"}} />
                        <div style={{display:"flex", gap:"8px", marginTop:"8px"}}>
                          <input type="time" value={b.start} onChange={e => setBlocks(p => p.map(x => x.id===b.id?{...x,start:e.target.value}:x))} style={{background:"#0f172a", border:"1px solid #334155", color:"#fff", fontSize:"10px", padding:"4px"}} />
                          <input type="time" value={b.end} onChange={e => setBlocks(p => p.map(x => x.id===b.id?{...x,end:e.target.value}:x))} style={{background:"#0f172a", border:"1px solid #334155", color:"#fff", fontSize:"10px", padding:"4px"}} />
                          <button onClick={() => deleteBlock(b.id)} style={{background:"#ef444420", border:"none", color:"#ef4444", fontSize:"10px", padding:"4px 8px", borderRadius:"4px"}}>DEL</button>
                        </div>
                      </div>
                    ) : (
                      <div style={{fontSize:"15px", fontWeight:700, color: isLive ? "#fff" : "#f1f5f9", marginTop:"4px"}}>{b.label}</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>}

        {tab === "timer" && <div className="animate-in" style={{display:"flex",flexDirection:"column",alignItems:"center",paddingTop:"60px"}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#0ea5e9",letterSpacing:"0.3em", marginBottom:"32px"}}>{timerMode.toUpperCase()} SESSION</div>
          <div style={{fontSize:"80px",fontWeight:200,color:"#f8fafc", fontFamily:"'DM Mono',monospace", marginBottom:"48px"}}>{fmt(timerSec)}</div>
          <div style={{display:"flex", gap:"16px"}}>
            <button onClick={() => setTimerOn(!timerOn)} style={{background:"#0ea5e9", color:"#020617", border:"none",borderRadius:"40px",padding:"16px 48px",fontWeight:800, letterSpacing:"0.1em"}}>{timerOn?"PAUSE":"START"}</button>
            <button onClick={() => {setTimerOn(false); setTimerSec(timerMode==="focus"?TIMER_DURATION:5*60);}} style={{background:"rgba(51, 65, 85, 0.5)", border:"1px solid #475569", color:"#cbd5e1", borderRadius:"40px", padding:"16px 32px", fontWeight:700}}>RESET</button>
          </div>
          <div style={{marginTop:"64px", display:"flex", gap:"12px"}}>
            {[["focus","25m"],["break","5m"]].map(([m, l]) => (
              <button key={m} onClick={() => {setTimerMode(m); setTimerSec(m==="focus"?TIMER_DURATION:300); setTimerOn(false);}} style={{background: timerMode===m ? "#0ea5e920" : "transparent", border: timerMode===m ? "1px solid #0ea5e9" : "1px solid #334155", color: timerMode===m ? "#0ea5e9" : "#64748b", padding:"8px 24px", borderRadius:"20px", fontSize:"11px", fontWeight:700}}>{l}</button>
            ))}
          </div>
        </div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
