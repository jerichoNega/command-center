<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Command Center" />
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { min-height: 100%; height: 100%; }
  body {
    background: #09090b;
    color: #fafafa;
    font-family: 'Syne', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow-x: hidden;
  }
  input, textarea, button { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }
  button { cursor: pointer; transition: all 0.2s ease; }
  button:active { transform: scale(0.98); }
  
  .glass {
    background: rgba(23, 23, 28, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  
  .card {
    background: #121217;
    border: 1px solid #1e1e24;
    border-radius: 12px;
    transition: all 0.2s ease;
  }
  .card:focus-within {
    border-color: #c8a96e66;
    background: #17171c;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 4px; }
  ::selection { background: #c8a96e33; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const SUPABASE_URL  = "https://gvfmbhxojigrwvxiloil.supabase.co/";
const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2Zm1iaHhvamlncnd2eGlsb2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDk4MTEsImV4cCI6MjA5MDg4NTgxMX0.JgnlAXIAH_p2wfmeqvSRiZ6CcUPVzmov-JHKE9LtHAY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TIMER_DURATION = 25 * 60;

const DEFAULT_DATA = {
  priorities: [{id:1,text:"",done:false},{id:2,text:"",done:false},{id:3,text:"",done:false}],
  dump: [],
  goals: ["","","","",""],
  weekNotes: { win:"", obstacle:"", next:"" },
  blocks: [
    {id:1,label:"Morning anchor",start:"05:00",end:"08:30",color:"#c8a96e"},
    {id:2,label:"Deep work",start:"09:00",end:"12:00",color:"#7eb8a4"},
    {id:3,label:"Admin / email",start:"12:00",end:"13:30",color:"#8b9bb4"},
    {id:4,label:"Learning",start:"14:00",end:"16:00",color:"#a07ec8"},
    {id:5,label:"Shutdown ritual",start:"18:00",end:"18:30",color:"#c87e7e"},
  ],
};

function ls(k, fb) { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fb; } catch { return fb; } }
function lss(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function SetupScreen({ onDone }) {
  const [key, setKey] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const go = async () => {
    const trimmed = key.trim().toLowerCase().replace(/\s+/g, "-");
    if (trimmed.length < 3) { setErr("At least 3 characters please"); return; }
    setLoading(true); setErr("");
    try {
      const { data, error } = await sb.from("command_center").select("data").eq("sync_key", trimmed).maybeSingle();
      if (error) throw error;
      lss("cc_sync_key", trimmed);
      onDone(trimmed, data?.data || null);
    } catch (e) { setErr("Connection error."); }
    setLoading(false);
  };
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:"32px"}}>
      <h1 style={{fontSize:"24px",fontWeight:700,color:"#f0ece4",marginBottom:"32px"}}>Command Center</h1>
      <input value={key} onChange={e => setKey(e.target.value)} onKeyDown={e => e.key === "Enter" && go()} placeholder="Sync Key" className="card" style={{background:"#121217",padding:"14px 16px",width:"100%",maxWidth:"320px",color:"#fafafa",textAlign:"center",marginBottom:"16px"}} />
      <button onClick={go} style={{background:"#c8a96e",border:"none",borderRadius:"8px",color:"#09090b",fontWeight:700,padding:"12px 32px"}}>{loading?"Connecting...":"Enter"}</button>
    </div>
  );
}

function App() {
  const [syncKey, setSyncKey] = useState(() => ls("cc_sync_key", null));
  const [synced, setSynced] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle");
  const now = new Date();
  const today = now.toISOString().slice(0, 10);

  const [tab, setTab] = useState("today");
  const [priorities, setPriorities] = useState(DEFAULT_DATA.priorities);
  const [dump, setDump] = useState(DEFAULT_DATA.dump);
  const [dumpInput, setDumpInput] = useState("");
  const [goals, setGoals] = useState(DEFAULT_DATA.goals);
  const [weekNotes, setWeekNotes] = useState(DEFAULT_DATA.weekNotes);
  const [blocks, setBlocks] = useState(DEFAULT_DATA.blocks);
  const [editBlock, setEditBlock] = useState(null);
  const [timerSec, setTimerSec] = useState(TIMER_DURATION);
  const [timerOn, setTimerOn] = useState(false);
  const [timerMode, setTimerMode] = useState("focus");
  const [sessions, setSessions] = useState(0);
  const [focusMode, setFocusMode] = useState(false);
  const timerRef = useRef(null);
  const saveTimer = useRef(null);
  const initialized = useRef(false);

  useEffect(() => { if (timerOn && timerMode === "focus") setFocusMode(true); }, [timerOn, timerMode]);

  const loadRemoteData = (remoteData) => {
    if (!remoteData) return;
    const ld = remoteData.lastDate;
    if (ld === today && remoteData.priorities) setPriorities([...remoteData.priorities]);
    if (remoteData.dump) setDump([...remoteData.dump]);
    if (remoteData.goals) setGoals([...remoteData.goals]);
    if (remoteData.weekNotes) setWeekNotes({...remoteData.weekNotes});
    if (remoteData.blocks) setBlocks([...remoteData.blocks]);
  };

  const fetchData = async () => {
    if (!syncKey) return;
    try {
      const { data, error } = await sb.from("command_center").select("data").eq("sync_key", syncKey).order('updated_at', { ascending: false });
      if (!error && data?.length > 0 && syncStatus === "idle") loadRemoteData(data[0].data);
    } catch (e) {}
  };

  useEffect(() => {
    if (!syncKey) return;
    (async () => { await fetchData(); setSynced(true); initialized.current = true; })();
  }, [syncKey]);

  useEffect(() => {
    if (!synced || !syncKey) return;
    const interval = setInterval(() => { if (syncStatus === "idle") fetchData(); }, 10000);
    return () => clearInterval(interval);
  }, [synced, syncKey, syncStatus]);

  const saveToCloud = useCallback((payload) => {
    if (!initialized.current || !syncKey) return;
    clearTimeout(saveTimer.current);
    setSyncStatus("saving");
    saveTimer.current = setTimeout(async () => {
      try {
        await sb.from("command_center").upsert({ sync_key: syncKey, data: payload, updated_at: new Date().toISOString() });
        setSyncStatus("saved"); setTimeout(() => setSyncStatus("idle"), 2000);
      } catch { setSyncStatus("error"); }
    }, 1200);
  }, [syncKey]);

  useEffect(() => { if (initialized.current) saveToCloud({ priorities, dump, goals, weekNotes, blocks, lastDate: today }); }, [priorities, dump, goals, weekNotes, blocks]);

  useEffect(() => {
    if (timerOn) {
      timerRef.current = setInterval(() => {
        setTimerSec(s => {
          if (s <= 1) {
            clearInterval(timerRef.current); setTimerOn(false);
            if (timerMode === "focus") { setSessions(n => n + 1); setTimerMode("break"); return 5*60; }
            else { setTimerMode("focus"); return TIMER_DURATION; }
          }
          return s - 1;
        });
      }, 1000);
    } else { clearInterval(timerRef.current); }
    return () => clearInterval(timerRef.current);
  }, [timerOn, timerMode]);

  if (!syncKey || !synced) return <SetupScreen onDone={(k, d) => { setSyncKey(k); loadRemoteData(d); setSynced(true); initialized.current = true; }} />;

  const doneCount = priorities.filter(p => p.done && p.text.trim()).length;
  const totalCount = priorities.filter(p => p.text.trim()).length;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const getHour = t => { const [h,m] = t.split(":").map(Number); return h + m/60; };
  const DAY_START = 5, DAY_END = 22, SPAN = 17;
  const nowH = now.getHours() + now.getMinutes()/60;
  const nowPct = Math.max(0, Math.min(1, (nowH - DAY_START) / SPAN));
  const circ = 2 * Math.PI * 54, dash = circ * (1 - timerSec / (timerMode === "focus" ? TIMER_DURATION : 5*60)), hours = [5,7,9,11,13,15,17,19,21];
  const statusColor = { idle:"#3a3a42", saving:"#c8a96e", saved:"#7eb8a4", error:"#c87e7e" }[syncStatus];
  const currentPriorityText = priorities.find(p => !p.done && p.text.trim())?.text || "Stay focused";

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      {focusMode && (
        <div className="animate-in" style={{position:"fixed",inset:0,zIndex:1000,background:"#09090b",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px"}}>
          <button onClick={() => {setFocusMode(false); setTimerOn(false);}} style={{position:"absolute",top:"30px",right:"30px",background:"none",border:"none",color:"#5a5a62",fontFamily:"'DM Mono',monospace",fontSize:"12px"}}>EXIT FOCUS</button>
          <div style={{textAlign:"center",marginBottom:"60px"}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#c8a96e",letterSpacing:"0.3em",marginBottom:"16px"}}>CURRENT FOCUS</div>
            <h2 style={{fontSize:"32px",fontWeight:700,color:"#f0ece4",maxWidth:"600px"}}>{currentPriorityText}</h2>
          </div>
          <div style={{position:"relative",width:"240px",height:"240px",marginBottom:"40px",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="240" height="240" style={{position:"absolute",transform:"rotate(-90deg)"}}>
              <circle cx="120" cy="120" r="110" fill="none" stroke="#17171c" strokeWidth="4" />
              <circle cx="120" cy="120" r="110" fill="none" stroke="#c8a96e" strokeWidth="4" strokeDasharray={2*Math.PI*110} strokeDashoffset={(2*Math.PI*110)*(1-timerSec/TIMER_DURATION)} strokeLinecap="round" />
            </svg>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"64px",color:"#f0ece4"}}>{fmt(timerSec)}</div>
          </div>
          <button onClick={() => setTimerOn(!timerOn)} style={{background:"transparent",border:"1px solid #c8a96e",color:"#c8a96e",borderRadius:"40px",padding:"16px 48px",fontFamily:"'DM Mono',monospace"}}>{timerOn?"PAUSE":"RESUME"}</button>
        </div>
      )}

      <header className="glass" style={{padding:"24px 32px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:10}}>
        <div>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#c8a96e"}}>{DAYS[now.getDay()].toUpperCase()}</div>
          <h1 style={{fontSize:"24px",fontWeight:800}}>{MONTHS[now.getMonth()]} {now.getDate()}</h1>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#7eb8a4"}}>{doneCount}/{totalCount} DONE</div>
          <div style={{fontSize:"9px",color:statusColor}}>{syncStatus.toUpperCase()}</div>
        </div>
      </header>

      <nav className="glass" style={{display:"flex",overflowX:"auto",position:"sticky",top:"80px",zIndex:9}}>
        {["today","goals","schedule","timer"].map(k => (
          <button key={k} onClick={() => setTab(k)} style={{flex:1,padding:"16px",border:"none",background:"transparent",color:tab===k?"#c8a96e":"#5a5a62",borderBottom:tab===k?"2px solid #c8a96e":"2px solid transparent",fontSize:"10px",fontWeight:700}}>{k.toUpperCase()}</button>
        ))}
      </nav>

      <div style={{flex:1,overflowY:"auto",padding:"32px 24px",maxWidth:"720px",margin:"0 auto",width:"100%"}}>
        {tab === "today" && <div className="animate-in">
          <div style={{marginBottom:"48px"}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#5a5a62",marginBottom:"16px"}}>THE BIG 3</div>
            {priorities.map((p,i) => (
              <div key={p.id} className="card" style={{display:"flex",alignItems:"center",gap:"16px",padding:"16px 20px",marginBottom:"12px",opacity:p.done?0.5:1}}>
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#c8a96e"}}>{i+1}</span>
                <div onClick={() => setPriorities(prev => prev.map(x => x.id===p.id?{...x,done:!x.done}:x))} style={{width:"20px",height:"20px",borderRadius:"50%",border:p.done?"2px solid #7eb8a4":"2px solid #3a3a42",background:p.done?"#7eb8a4":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{p.done && "✓"}</div>
                <input value={p.text} onChange={e => setPriorities(prev => prev.map(x => x.id===p.id?{...x,text:e.target.value}:x))} style={{background:"transparent",border:"none",color:"#fafafa",fontFamily:"'Lora',serif",fontSize:"17px",flex:1,textDecoration:p.done?"line-through":"none"}} />
              </div>
            ))}
          </div>
          <div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#5a5a62",marginBottom:"16px"}}>BRAIN DUMP</div>
            <div style={{display:"flex",gap:"12px",marginBottom:"20px"}}>
              <input value={dumpInput} onChange={e => setDumpInput(e.target.value)} onKeyDown={e => {if(e.key==="Enter"&&dumpInput.trim()){setDump(p=>[{id:Date.now(),text:dumpInput.trim(),done:false},...p]);setDumpInput("");}}} placeholder="Capture..." className="card" style={{flex:1,background:"#121217",padding:"14px 16px",color:"#fafafa"}} />
            </div>
            {dump.map(d => (
              <div key={d.id} style={{display:"flex",alignItems:"center",gap:"14px",padding:"12px 0",borderBottom:"1px solid #17171c",opacity:d.done?0.5:1}}>
                <div onClick={() => setDump(prev => prev.map(x => x.id===d.id?{...x,done:!x.done}:x))} style={{width:"16px",height:"16px",borderRadius:"50%",border:"2px solid #3a3a42",display:"flex",alignItems:"center",justifyContent:"center"}}>{d.done && "✓"}</div>
                <span style={{flex:1,fontFamily:"'Lora',serif",fontSize:"15px",textDecoration:d.done?"line-through":"none"}}>{d.text}</span>
                <button onClick={() => setDump(p => p.filter(x => x.id!==d.id))} style={{background:"none",border:"none",color:"#3a3a42"}}>×</button>
              </div>
            ))}
          </div>
        </div>}

        {tab === "goals" && <div className="animate-in">
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:"10px",color:"#5a5a62",marginBottom:"16px"}}>GOALS</div>
          {goals.map((g,i) => (
            <input key={i} value={g} onChange={e => setGoals(p => {const n=[...p]; n[i]=e.target.value; return n;})} placeholder={`Goal ${i+1}`} className="card" style={{width:"100%",background:"transparent",padding:"12px 0",border:"none",borderBottom:"1px solid #1e1e24",color:"#fafafa",marginBottom:"8px"}} />
          ))}
        </div>}

        {tab === "schedule" && <div className="animate-in" style={{display:"flex",gap:"16px"}}>
          <div style={{width:"40px",position:"relative",minHeight:"500px"}}>
            {hours.map(h => <div key={h} style={{position:"absolute",top:`${((h-DAY_START)/SPAN)*100}%`,fontSize:"9px",color:"#3a3a42"}}>{h}:00</div>)}
          </div>
          <div style={{flex:1,position:"relative",borderLeft:"1px solid #1e1e24"}}>
            {blocks.map(b => {
              const s=getHour(b.start), e=getHour(b.end);
              return <div key={b.id} onClick={() => setEditBlock(editBlock===b.id?null:b.id)} style={{position:"absolute",top:`${((s-DAY_START)/SPAN)*100}%`,height:`${((e-s)/SPAN)*100}%`,left:10,right:0,background:`${b.color}20`,borderLeft:`3px solid ${b.color}`,padding:8}}>
                <div style={{fontSize:"10px",color:b.color}}>{b.start}</div>
                {editBlock===b.id ? <input autoFocus value={b.label} onChange={e => setBlocks(p => p.map(x => x.id===b.id?{...x,label:e.target.value}:x))} style={{background:"transparent",border:"none",color:"#fff",width:"100%"}} /> : <div style={{fontSize:"12px"}}>{b.label}</div>}
              </div>
            })}
          </div>
        </div>}

        {tab === "timer" && <div className="animate-in" style={{display:"flex",flexDirection:"column",alignItems:"center",paddingTop:"40px"}}>
          <div style={{fontSize:"48px",fontWeight:300,marginBottom:"32px"}}>{fmt(timerSec)}</div>
          <button onClick={() => setTimerOn(!timerOn)} style={{background:"#c8a96e",border:"none",borderRadius:"40px",padding:"16px 48px",fontWeight:700}}>{timerOn?"PAUSE":"START FOCUS"}</button>
          <button onClick={() => {setTimerOn(false); setTimerSec(TIMER_DURATION);}} style={{background:"none",border:"none",color:"#5a5a62",marginTop:"16px"}}>RESET</button>
        </div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
